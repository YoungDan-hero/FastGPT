server {
    listen 8080;
    access_log off;

    location = /health {
        return 200;
    }

    location / {
        proxy_pass http://mcp-sse:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Fastgpt-Auth-Proxy-Username "";
        proxy_set_header X-Fastgpt-Auth-Proxy-Tmb-Id "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
